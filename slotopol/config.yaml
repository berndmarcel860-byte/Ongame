# Slotopol Server Configuration
# Docs: https://github.com/slotopol/server

server:
  host: "0.0.0.0"
  port: 8100
  mode: release

# MySQL database
database:
  driver: mysql
  host: mysql
  port: 3306
  name: slotopol
  user: slotopol
  password: "${MYSQL_PASSWORD}"
  charset: utf8mb4
  parse_time: true

# Club settings
club:
  name: "Ongame Casino"
  currency: USD
  min_bet: 0.10
  max_bet: 500.00
  rtp: 96.0          # Return to player percentage

# API security
api:
  key: "${SLOTOPOL_API_KEY}"

logging:
  level: info
  format: json
